name: CI

# Every pull request (and every push to main): style, types, tests, the
# addon's Lua tests, the desktop app's smoke test, and a CHANGELOG line.
# Branch protection on main requires these to pass. workflow_dispatch: the
# game-data workflow starts it on its bot branch (its own pull requests don't
# trigger pull_request; the CHANGELOG check is skipped there).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Style (Biome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec biome ci .

  check:
    name: Types and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r check
      - run: pnpm -r --if-present test

  addon:
    name: Addon (Lua)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y luajit
      - run: for t in apps/addon/tests/*_test.lua; do luajit "$t" || exit 1; done

  desktop:
    name: Desktop smoke test
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter "@guildie/desktop..."
      # Against the live site: it checks the app (bridge, addon install,
      # uploader), not the site's code in this PR.
      - run: pnpm --filter @guildie/desktop smoke --url https://guildie.club

  changelog:
    name: CHANGELOG entry
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Players read these in the app. Skip with the "skip-changelog" label
      # for changes they won't notice (docs, tests, tooling).
      - name: Unreleased has a line from this PR
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'skip-changelog') }}
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          added=$(git diff "$base"...HEAD -- CHANGELOG.md | grep '^+- ' || true)
          if [ -z "$added" ]; then
            echo "::error::Add a line for players under '## Unreleased' in CHANGELOG.md (or label the PR skip-changelog)."
            exit 1
          fi
          # Each line says where the change shows: Guildie (the site), App, Addon, or several.
          unlabeled=$(printf '%s\n' "$added" | grep -vE '^\+- \*\*(Guildie|App|Addon)(, (Guildie|App|Addon))*:\*\* ' || true)
          if [ -n "$unlabeled" ]; then
            echo "::error::Start each CHANGELOG line with where it changes: **Guildie:**, **App:**, **Addon:** (or several, e.g. **Guildie, App:**)."
            printf '%s\n' "$unlabeled"
            exit 1
          fi
