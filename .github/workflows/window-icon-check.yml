name: Windows window icon check
on:
  workflow_dispatch:
jobs:
  icon:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter "@guildie/desktop..."
      - run: pnpm --filter @guildie/desktop build
      - name: Build native icon probe
        working-directory: apps/desktop
        run: pnpm exec esbuild scripts/probe-window-icon.ts --bundle --platform=node --format=esm --external:electron --external:koffi --define:__VERSION__='"probe"' --outfile=dist/icon-probe.mjs --banner:js='import { createRequire } from "node:module"; import { fileURLToPath } from "node:url"; import { dirname } from "node:path"; const require = createRequire(import.meta.url); const __dirname = dirname(fileURLToPath(import.meta.url));'
      - name: Check the running window icon
        working-directory: apps/desktop
        run: pnpm exec electron dist/icon-probe.mjs
