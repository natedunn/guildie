# electron-builder: pnpm --filter @guildie/desktop build:win (on Windows) or
# build:win-cross (from macOS, no wine), build:mac (on a Mac), build:linux.
# Output in apps/desktop/release. Releases:
# .github/workflows/desktop-release.yml (README.md, "Releasing"). The asset
# names are fixed: the site links them
# (releases/latest/download/<name>), so don't rename them.
appId: club.guildie.desktop
productName: Guildie
copyright: Guildie
directories:
  output: release
# Everything the app needs is bundled into dist/ (scripts/build.mjs).
files:
  - dist/**/*
  - "!dist/**/*.map"
  # The packages' own icons (electron-builder reads them from assets/), not
  # needed at runtime.
  - "!dist/assets/linux"
  - "!dist/assets/*.icns"
  - package.json
asar: true
extraMetadata:
  main: dist/main.cjs
  # The installer's folder name (%LOCALAPPDATA%\Programs\guildie); the
  # workspace name, @guildie/desktop, would make it "@guildiedesktop".
  name: guildie
  # Linux: the .desktop file's name, Electron's Wayland app_id and the
  # entry's StartupWMClass (linux.syncDesktopName), so the dock groups the
  # window with its launcher.
  desktopName: guildie.desktop
# The addon the app installs into WoW (src/addon.ts reads it from
# resources/addon/Guildie: Guildie.app/Contents/Resources/addon/Guildie on
# macOS, inside the AppImage on Linux), on every OS. GuildieData.lua is the
# app's to write, per player. Each platform's own extraResources add to this.
extraResources:
  - from: ../addon/Guildie
    to: addon/Guildie
    filter:
      - "**/*"
      - "!GuildieData.lua"
# Where the app looks for updates (src/updater.ts; baked in as
# resources/app-update.yml) and where the release workflow uploads. Tags are
# desktop-v<version> so they don't collide with other releases; published as
# a normal release, since electron-updater only sees the repo's latest one.
publish:
  provider: github
  owner: natedunn
  repo: guildie
  tagNamePrefix: desktop-v
  releaseType: release
win:
  extraResources:
    # koffi's Windows binary, for hiding Windows 11's accent-color window border
    # (src/window-border.ts). koffi looks for it in resources/koffi/<platform>.
    - from: node_modules/koffi/build/koffi/win32_x64
      to: koffi/win32_x64
      filter:
        - koffi.node
    # Explorer cannot load a taskbar group icon from inside app.asar.
    - from: assets/guildie.ico
      to: guildie.ico
    - from: capture/dist/GuildieCapture
      to: capture
      filter:
        - "**/*"
  icon: dist/assets/guildie.ico
  executableName: Guildie
  # The installer is the one that updates itself; the zip is for trying a
  # build (build:win-cross) and never updates.
  target:
    - target: nsis
      arch: [x64]
    - target: zip
      arch: [x64]
  artifactName: Guildie-${version}-win-${arch}.${ext}
# Per user (%LOCALAPPDATA%\Programs\guildie), no admin prompt, one click;
# updates run the same installer silently.
nsis:
  oneClick: true
  perMachine: false
  runAfterFinish: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Guildie
  artifactName: Guildie-Setup-${version}.${ext}
# macOS: one universal app (Apple Silicon and Intel). The dmg is the
# download; the zip is what installed apps update from (src/mac-updater.ts,
# via latest-mac.yml). Signing is decided by scripts/package.mjs: ad-hoc
# without a certificate (today), Developer ID + notarized once the CSC_LINK and
# APPLE_API_* secrets exist. The settings here are the signed ones.
mac:
  target:
    - target: dmg
      arch: [universal]
    - target: zip
      arch: [universal]
  icon: assets/guildie.icns
  category: public.app-category.games
  artifactName: Guildie-mac-${arch}.${ext}
  hardenedRuntime: true
  # Electron 45's floor.
  minimumSystemVersion: "12.0"
dmg:
  artifactName: Guildie-mac-${arch}.${ext}
  # A disk image only to drag the app out of: the app updates itself after.
  writeUpdateInfo: false
# Linux: an AppImage, which updates itself (electron-updater's
# AppImageUpdater, via latest-linux.yml). One file, no install.
linux:
  target:
    - target: AppImage
      arch: [x64]
  icon: assets/linux
  category: Game
  synopsis: Your WoW Forever guild, and the Guildie addon kept up to date
  description: Guildie in its own window. Installs and updates the Guildie addon, uploads what it saves in game and downloads your guild's data for its tooltips.
  syncDesktopName: true
  artifactName: Guildie-linux-x86_64.${ext}
